<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMLDESKTOP</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: sans-serif;
            background: #111827;
            color: white;
        }

        main {
            text-align: center;
        }

        button {
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }


        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        .titlebar {
            height: 38px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 14px;
            background: #202124;
            color: white;
            font: 13px sans-serif;
            user-select: none;
        }

        .titlebar-title {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .titlebar-actions {
            display: flex;
            height: 100%;
        }

        .titlebar-button {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            border: 0;
            color: white;
            background: transparent;
            font-size: 20px;
            cursor: pointer;
            text-align: center;
        }

        .titlebar-button:hover {
            background: #444746;
        }

        .titlebar-button.close:hover {
            background: #c42b1c;
        }

        .titlebar-button:focus-visible {
            outline: 2px solid #8ab4f8;
            outline-offset: -3px;
        }
    </style>
</head>

<body>
    <header class="titlebar">
        <span class="titlebar-title">HTMLDESKTOP App</span>

        <div class="titlebar-actions">
            <button class="titlebar-button minimize" type="button" id="minimize" aria-label="Minimize">−</button>
            <button class="titlebar-button maximize" type="button" id="maximize" aria-label="Maximize">□</button>
            <button class="titlebar-button close" type="button" id="close" aria-label="Close">×</button>
        </div>
    </header>

    <main>


        <div id="htmldesktop-test" style="font-family: sans-serif; padding: 20px;">
            <h2>HTMLDESKTOP Runtime Test</h2>
            <button id="test-htmldesktop">Test native API</button>
            <pre id="htmldesktop-results">Click the button to begin.</pre>
        </div>
    </main>

    <script>
        const button = document.getElementById("test-htmldesktop");
        const output = document.getElementById("htmldesktop-results");

        button.addEventListener("click", async () => {
            button.disabled = true;

            try {
                output.textContent = "Checking JavaScript bridge...\n";

                if (!window.htmldesktop) {
                    throw new Error("window.htmldesktop is missing.");
                }

                output.textContent += "Calling app.getInfo()...\n";

                const info = await window.htmldesktop.app.getInfo();

                output.textContent += "App info received.\n";
                output.textContent += "Calling system.getPlatform()...\n";

                const platform =
                    await window.htmldesktop.system.getPlatform();

                output.textContent += "Platform received.\n";
                output.textContent += "Calling path.join()...\n";

                const joinedPath =
                    await window.htmldesktop.path.join("hello", "world.txt");

                output.textContent = JSON.stringify({
                    success: true,
                    info,
                    platform,
                    joinedPath
                }, null, 2);
            } catch (error) {
                output.textContent += "\nERROR: " +
                    (error.message || String(error));
            } finally {
                button.disabled = false;
            }
        });

        const controls = window.webkit.messageHandlers.windowControls;

        document.getElementById("minimize").onclick = () =>
            controls.postMessage("minimize");

        document.getElementById("maximize").onclick = () =>
            controls.postMessage("maximize");

        document.getElementById("close").onclick = () => {
            controls.postMessage("close");
        }

    </script>
</body>

</html>
